# Daily: applies patches/ onto a fresh clone of upstream dev, builds the APK, runs lint for
# API 32+ calls only (NewApi) and publishes the APK as a release. A patch that no longer
# applies or a NewApi error fails the run and publishes nothing.
name: Android 12 build

on:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths: [patches/**, .github/workflows/android12.yml]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if upstream has not moved
        type: boolean
        default: false

concurrency:
  group: android12

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Find upstream head
        id: upstream
        run: |
          git clone -q --branch dev https://github.com/anomalyco/opencode-android.git upstream
          sha=$(git -C upstream rev-parse HEAD)
          tag="a12-${sha::7}-$(git rev-parse --short=7 HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1 && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$tag is already published."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply the Android 12 patches
        if: steps.upstream.outputs.skip == 'false'
        working-directory: upstream
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git am -3 ../patches/*.patch; then
            git diff --name-only --diff-filter=U
            echo "::error::patches/ no longer apply to upstream ${{ steps.upstream.outputs.sha }}"
            exit 1
          fi

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.upstream.outputs.skip == 'false'
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        if: steps.upstream.outputs.skip == 'false'
        with:
          packages: platform-tools

      - name: Install the SDK platform and build tools
        if: steps.upstream.outputs.skip == 'false'
        run: yes | sdkmanager "platforms;android-37.0" "build-tools;37.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        if: steps.upstream.outputs.skip == 'false'
        with:
          build-root-directory: upstream

      - name: Prepare signing and mirror
        if: steps.upstream.outputs.skip == 'false'
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          home="$RUNNER_TEMP/android-user-home"
          mkdir -p "$home"
          echo "$DEBUG_KEYSTORE_B64" | base64 -d > "$home/debug.keystore"
          echo "ANDROID_USER_HOME=$home" >> "$GITHUB_ENV"
          install -Dm644 upstream/.github/gradle/maven-mirror.init.gradle.kts "${GRADLE_USER_HOME:-$HOME/.gradle}/init.d/maven-mirror.init.gradle.kts"

      - name: Build and lint for Android 12 calls
        if: steps.upstream.outputs.skip == 'false'
        working-directory: upstream
        env:
          OC_VERSION_CODE: ${{ github.run_number }}
          OC_VERSION_SUFFIX: ${{ steps.upstream.outputs.tag }}
        run: |
          printf '<?xml version="1.0" encoding="UTF-8"?>\n<lint>\n    <issue id="all" severity="ignore" />\n    <issue id="NewApi" severity="error" />\n</lint>\n' > lint.xml
          ./gradlew assembleDebug lintDebug

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && steps.upstream.outputs.skip == 'false'
        with:
          name: reports-${{ steps.upstream.outputs.tag }}
          path: |
            upstream/**/build/reports/
            upstream/**/build/test-results/
          retention-days: 7

      - name: Publish the release
        if: steps.upstream.outputs.skip == 'false'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          UPSTREAM: ${{ steps.upstream.outputs.sha }}
        run: |
          cp upstream/app/build/outputs/apk/debug/app-debug.apk opencode-android12.apk
          signer=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs opencode-android12.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          if [ "$signer" != "c2da67dad239104fde8c26ae1c76c59734b07c2b1ee0af907c54ef681f006e61" ]; then
            echo "::error::APK is signed with $signer, not the Android 12 key"
            exit 1
          fi
          gh release delete "$TAG" --yes --cleanup-tag > /dev/null 2>&1 || true
          gh release create "$TAG" opencode-android12.apk --latest --target "$GITHUB_SHA" \
            --title "Android 12 · upstream ${UPSTREAM::7}" \
            --notes "anomalyco/opencode-android dev at ${UPSTREAM} with patches/ applied. Version code ${GITHUB_RUN_NUMBER}."
          gh release list --limit 100 --json tagName --jq '.[].tagName' | grep '^a12-' | tail -n +11 |
            xargs -r -I{} gh release delete {} --yes --cleanup-tag
